# Alembic configuration.
#
# The database URL is deliberately absent: it is a secret, and secrets do not
# belong in a file that is committed. migrations/env.py reads it from the same
# validated Settings object the application uses, so migrations and the
# application can never disagree about which database they mean.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Migration filenames get a UTC timestamp prefix so `ls` shows them in the
# order they were written, which is almost always the order they apply in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# `exec`, not `console_scripts`: ruff ships as a native binary rather than a
# Python entry point, so alembic cannot import it.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Alembic's own logging is configured by the application's logging setup when
# migrations run in-process; this section covers the standalone `alembic` CLI.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
