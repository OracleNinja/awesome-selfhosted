# Private SearXNG for Ornith Cloud.
#
# NOT PUBLIC, deliberately. There is no [http_service] block and no public IP
# should ever be allocated to this app. An openly reachable SearXNG is an open
# search proxy: anyone can drive queries through it, and it will be found and
# abused. The gateway reaches it only over Fly's private network.
#
# Reachability model — this is the part worth understanding:
#
#   .internal   resolves to the machine's 6PN address (IPv6 only) and connects
#               DIRECTLY, bypassing fly-proxy. The process must therefore be
#               listening on :: , not just 0.0.0.0.
#
#   .flycast    routes through fly-proxy over a PRIVATE IPv6 address. Because
#               fly-proxy terminates the connection and dials the machine, a
#               process bound to 0.0.0.0 works fine.
#
# Both are configured below: BIND_ADDRESS makes .internal work, and the
# [[services]] block plus a private IPv6 makes .flycast work. Use whichever
# hostname `fly ips list` and `fly status` actually confirm — do not assume.

# CHANGE ME: must be globally unique across Fly.
app = "ornith-searxng"

# CHANGE ME: put this in the SAME region as the gateway. Cross-region private
# traffic adds latency to every search, which defeats the purpose.
primary_region = "lhr"

[build]
  # A local Dockerfile, not a bare `image = …`: settings.yml has to be baked
  # in, otherwise the container boots with upstream defaults and JSON output
  # stays disabled. Pin the upstream tag to a digest in Dockerfile once the
  # deployment is known good.
  dockerfile = "Dockerfile"

[env]
  # Makes SearXNG listen dual-stack so the .internal (IPv6) path works. The
  # image otherwise binds 0.0.0.0 and .internal connections are refused —
  # which presents as a timeout and looks like a firewall problem.
  BIND_ADDRESS = "[::]:8080"

  # Used by SearXNG to build absolute URLs. It is not a public address; the
  # value only needs to be consistent.
  SEARXNG_BASE_URL = "http://ornith-searxng.flycast:8080/"

  INSTANCE_NAME = "ornith-private"

  # Keep the worker count low: this instance serves one caller.
  SEARXNG_WORKERS = "2"

# A plain [[services]] block rather than [http_service]: http_service implies a
# public HTTPS listener, which is exactly what must not exist here.
[[services]]
  protocol = "tcp"
  internal_port = 8080

  auto_start_machines = true
  # Search latency is on the critical path for every retrieval query, so the
  # instance stays warm rather than paying a cold start per question.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # SearXNG is comfortable at 512mb for a single caller; raise it if the
  # engine set is widened.
  memory = "512mb"
  cpus = 1

# settings.yml is delivered by the local Dockerfile in this directory.
