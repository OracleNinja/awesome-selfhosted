# SearXNG configuration for a private, single-caller Ornith deployment.
#
# NO SECRETS IN THIS FILE. `secret_key` below is the sentinel value that the
# official image's entrypoint substitutes at container start from the
# SEARXNG_SECRET environment variable — set that with `fly secrets set`.
#
# Three settings here are load-bearing. Getting any of them wrong makes the
# gateway's search calls fail in ways that look like networking faults:
#
#   1. search.formats must include `json`. SearXNG serves HTML only by
#      default and returns 403 for ?format=json.
#   2. server.method must allow GET. The default is POST-only, and the
#      gateway's adapter issues GET /search?q=…&format=json.
#   3. server.limiter must be off. The bot limiter rejects requests without
#      browser-like headers, which is every request the gateway makes.

use_default_settings: true

general:
  instance_name: "Ornith Private Search"
  # Nothing here is user-facing; no donation or contact links.
  contact_url: false
  enable_metrics: false

server:
  # Sentinel replaced at start-up from $SEARXNG_SECRET. Not a credential.
  secret_key: "ultrasecretkey"

  # (2) The gateway calls GET /search?q=…&format=json.
  method: "GET"

  # (3) The limiter blocks non-browser clients. There is no public traffic to
  # protect against here, and the limiter additionally wants Redis.
  limiter: false

  # Marks this as a private instance; also relaxes the public-instance
  # restrictions that would otherwise refuse API-shaped requests.
  public_instance: false

  # No browser renders these results, so proxying images is wasted work.
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"

  # (1) REQUIRED. Without `json` the gateway receives 403 on every search.
  formats:
    - html
    - json

outgoing:
  # The gateway gives search an 8s budget (ORNITH_SEARCH_TIMEOUT_MS); keeping
  # SearXNG's own timeouts below that means a slow engine fails fast rather
  # than consuming the caller's entire allowance.
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

ui:
  static_use_hash: true
