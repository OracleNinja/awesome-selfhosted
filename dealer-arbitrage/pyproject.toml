[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealer-arbitrage"
version = "1.0.0"
description = "Assisted acquisition system for manufacturer/dealer-sponsored evaluation units"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.4"]

[project.scripts]
da = "dealer_arbitrage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
