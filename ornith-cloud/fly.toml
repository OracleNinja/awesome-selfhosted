# Ornith Cloud Gateway — public edge. Reached through Fly Proxy, so it can
# autostop and still wake on request. The gateway itself reaches SearXNG over
# the private network (6PN), never through a public URL.
app = "ornith-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret environment. Secrets (ORNITH_GATEWAY_TOKEN, ANTHROPIC_API_KEY,
# SEARCH_API_KEY) are set separately with `fly secrets set` and never live in
# this file or in git.
[env]
  AI_PROVIDER = "anthropic"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

  # Liveness is deliberately unauthenticated and reveals nothing about config.
  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
