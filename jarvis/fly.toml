# JARVIS — Fly Machines configuration.
#
# This app IS public: it answers over HTTPS from wherever you are. That makes
# JARVIS_API_TOKEN mandatory, and not merely as advice —
# apps/server/src/auth.ts binds 127.0.0.1 when no token is set, and fly-proxy
# reaches the machine over its private address, so an untokened deploy is
# simply unreachable. The safety default and the deployment requirement are the
# same switch, which is why there is no way to expose this without auth.
#
# No secret belongs in this file. Set them with `fly secrets set` — see README.

# CHANGE ME: must be globally unique across Fly.
app = "jarvis-os"

# CHANGE ME: pick the region closest to you.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Must match http_service.internal_port below and the app's own default.
  PORT = "8787"
  NODE_ENV = "production"

  # Both live on the mounted volume so they survive deploys and restarts. The
  # paths are absolute on purpose: JARVIS_WORKSPACE_DIR is resolved against
  # repoRoot() when relative, which would put it inside the image instead.
  DATABASE_URL = "file:/data/jarvis.db"
  JARVIS_WORKSPACE_DIR = "/data/workspace"

  # Risk levels that always stop for a human decision. Worth keeping strict on
  # a machine reachable from the internet.
  APPROVAL_REQUIRED_LEVELS = "EXTERNAL_ACTION,DESTRUCTIVE"

# SQLite is a single-writer file on a single volume, so this app runs as
# exactly one machine. Do not `fly scale count` above 1: a second machine gets
# its own volume and its own divergent database, silently.
[mounts]
  source = "jarvis_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_start_machines = true

  # Stopping when idle costs nothing to keep and adds a few seconds to the
  # first request after a quiet period; the Control Room's event stream
  # reconnects on its own once the machine is up. Set min_machines_running = 1
  # if you would rather pay to keep it warm.
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    # Unauthenticated by design, so the health check works without the token.
    # It reports liveness and schema version only — see apps/server/src/routes.ts.
    path = "/api/health"
    protocol = "http"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb is enough for the runtime; raise it if you attach MCP servers, since
  # each one is an additional child process.
  memory = "512mb"
  cpus = 1
