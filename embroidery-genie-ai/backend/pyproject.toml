[project]
name = "embroidery-genie-ai"
version = "1.0.0"
description = "AI-powered embroidery digitizing and production management"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI dependencies are function calls in defaults by design
    "E501",  # long lines are caught by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "I001"]
