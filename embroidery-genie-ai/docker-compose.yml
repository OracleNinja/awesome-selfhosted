# Embroidery Genie AI — full stack for local development and self-hosting.
#
#   cp backend/.env.example backend/.env
#   cp frontend/.env.example frontend/.env
#   docker compose up --build
#
# Then: http://localhost:3000 (app) and http://localhost:8000/docs (API).

name: embroidery-genie

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genie
      POSTGRES_PASSWORD: genie
      POSTGRES_DB: embroidery_genie
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genie -d embroidery_genie"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://genie:genie@db:5432/embroidery_genie
      ENVIRONMENT: development
      # No Supabase project needed to try the app out. Turn this off and set
      # SUPABASE_URL / SUPABASE_JWT_SECRET for real accounts.
      ALLOW_DEV_AUTH: "true"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations run on start so a fresh volume comes up usable.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  storage_data:
